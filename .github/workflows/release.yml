name: Release

on:
  push:
    tags: ["v*"]
  # Manual rehearsal: runs the whole pipeline with `npm publish --dry-run`, so
  # the credentials, the assembled tarballs and the version checks can all be
  # verified without burning a version number.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Assemble and check everything, but do not publish"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross toolchain (linux arm64)
        if: matrix.cross
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          # Both names, so a plain tarball install also gets the `qc` alias.
          tar -czf $GITHUB_WORKSPACE/quota-check-${{ matrix.target }}.tar.gz quota-check qc

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf $env:GITHUB_WORKSPACE/quota-check-${{ matrix.target }}.tar.gz quota-check.exe qc.exe

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: quota-check-${{ matrix.target }}.tar.gz
          retention-days: 7

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: quota-check-${{ matrix.target }}.tar.gz

  # Publishes the per-platform binary packages, then the main package.
  # Requires the repo variable NPM_PUBLISH=true and the NPM_TOKEN secret.
  publish-npm:
    if: vars.NPM_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    env:
      # A manual run defaults to a rehearsal; a tag push always publishes.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # ci.yml does not run on tag pushes, so re-check here: publishing a
      # release whose manifests disagree with the tag is unrecoverable (npm
      # versions are immutable).
      - name: Tag and manifests agree
        run: |
          set -euo pipefail
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "tag=$tag  Cargo.toml=$crate"
            if [ "$tag" != "$crate" ]; then
              echo "::error::tag v$tag does not match Cargo.toml version $crate"
              exit 1
            fi
          else
            echo "manual run on ${GITHUB_REF_NAME}; checking manifests against Cargo.toml $crate"
          fi
          node -e '
            const fs = require("fs");
            const want = process.argv[1];
            const main = JSON.parse(fs.readFileSync("npm/quota-check/package.json"));
            const bad = [];
            if (main.version !== want) bad.push(`npm/quota-check is ${main.version}`);
            for (const [dep, v] of Object.entries(main.optionalDependencies)) {
              if (v !== want) bad.push(`${dep} pinned at ${v}`);
              const p = JSON.parse(fs.readFileSync(`npm/${dep}/package.json`));
              if (p.version !== want) bad.push(`${dep} package.json is ${p.version}`);
            }
            if (bad.length) {
              console.log(`::error::version drift vs ${want}: ${bad.join("; ")}`);
              process.exit(1);
            }
            console.log(`all manifests at ${want}`);
          ' "$crate"

      # Fails loudly on a missing, expired or wrongly-scoped token, before any
      # package has gone out.
      - name: Verify npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is empty"
            exit 1
          fi
          echo "publishing as: $(npm whoami)"

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: artifacts

      - name: Assemble platform packages
        run: |
          set -euo pipefail
          declare -A MAP=(
            [aarch64-apple-darwin]=quota-check-darwin-arm64
            [x86_64-apple-darwin]=quota-check-darwin-x64
            [x86_64-unknown-linux-gnu]=quota-check-linux-x64
            [aarch64-unknown-linux-gnu]=quota-check-linux-arm64
            [x86_64-pc-windows-msvc]=quota-check-windows-x64
          )
          for target in "${!MAP[@]}"; do
            pkg="${MAP[$target]}"
            dir="npm/$pkg"
            tar -xzf "artifacts/binary-$target/quota-check-$target.tar.gz" -C "$dir"
            # The `files` allowlist decides what ships; make sure the binary it
            # names actually arrived, or npm would publish an empty package.
            bin=$(node -e "console.log(require('./$dir/package.json').files[0])")
            if [ ! -f "$dir/$bin" ]; then
              echo "::error::$pkg is missing $bin after extracting the tarball"
              exit 1
            fi
            chmod +x "$dir/$bin"
            cp LICENSE "$dir/"
            ls -la "$dir"
          done
          cp LICENSE npm/quota-check/

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          [ "$DRY_RUN" = "true" ] && flags=(--dry-run) || flags=()
          for dir in npm/quota-check-darwin-arm64 npm/quota-check-darwin-x64 \
                     npm/quota-check-linux-x64 npm/quota-check-linux-arm64 \
                     npm/quota-check-windows-x64; do
            name=$(node -e "console.log(require('./$dir/package.json').name)")
            version=$(node -e "console.log(require('./$dir/package.json').version)")
            # Re-running a partially failed release must not hard-fail on the
            # packages that already went out.
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already on the registry)"
              continue
            fi
            (cd "$dir" && npm publish "${flags[@]+"${flags[@]}"}")
          done

      # Last, so `quota-check` never resolves optionalDependencies that do not
      # exist yet.
      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          [ "$DRY_RUN" = "true" ] && flags=(--dry-run) || flags=()
          version=$(node -e "console.log(require('./npm/quota-check/package.json').version)")
          if npm view "quota-check@$version" version >/dev/null 2>&1; then
            echo "skip quota-check@$version (already on the registry)"
            exit 0
          fi
          cd npm/quota-check && npm publish "${flags[@]+"${flags[@]}"}"

      - name: Summary
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "### Rehearsal only — nothing was published" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Published quota-check and its 5 platform packages" >> "$GITHUB_STEP_SUMMARY"
          fi
