[package]
name = "quota-check"
description = "Check Coding Agent quota usage (Codex, Claude, ...) from the terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "quota-check"
path = "src/main.rs"

[dependencies]
quota-check-core = { path = "../quota-check-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
