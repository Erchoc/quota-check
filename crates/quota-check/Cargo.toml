[package]
name = "quota-check"
description = "Check Coding Agent quota usage (Codex, Claude, ...) from the terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "quota-check"
path = "src/main.rs"

# Short alias, so `cargo install quota-check` also puts `qc` on PATH.
# (The npm package gets the same alias from its bin map, without shipping a
# second binary in the tarball.)
[[bin]]
name = "qc"
path = "src/bin/qc.rs"

[lib]
name = "quota_check"
path = "src/lib.rs"

[dependencies]
quota-check-core = { path = "../quota-check-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
